# Katalog topik seri "Petualangan Adab Qila & Ezra"
# Dihasilkan dari riset konten (docs/PLAN.md §5–6).
# Alur: agen usulkan → user pilih/mengurutkan → pipeline memproduksi.
#
# Field:
#   slug        id buku (nama folder books/<slug>)
#   title       judul Indonesia
#   concept     satu konsep adab (satu per buku)
#   key_phrase  frasa kunci yang diajarkan (maks 1 per buku)
#   key_phrase_source  sumber syariat (metadata, TIDAK tampil di buku)
#   pillar      1=rumah & keluarga, 2=publik & sekolah, 3=digital & global
#   age_band    "2-3" | "4-5"
#   hook        premis cerita Qila & Ezra
#   status      backlog | next | drafting | done
#   priority    urutan produksi (rendah = dulu)

books:
  # ── Pilar 1 — Rumah & Keluarga (prioritas utama) ──────────────────
  - slug: adab-salam
    title: Salam untuk Semua
    concept: menyapa dengan salam
    key_phrase: "Assalamu'alaikum"
    key_phrase_source: "HR. Bukhari no. 6217; HR. Muslim no. 2163"
    pillar: 1
    age_band: "2-3"
    hook: Ezra lupa salam saat Umi pulang; Qila ingatkan dengan senyum.
    status: next
    priority: 1

  - slug: bismillah-makan
    title: Bismillah, Makan Enak!
    concept: doa sebelum makan
    key_phrase: "Bismillah"
    key_phrase_source: "HR. Abu Dawud no. 3767; HR. Tirmidhi no. 1858"
    pillar: 1
    age_band: "2-3"
    hook: Ezra sudah mau suap; Qila tahan tangan: "Bismillah dulu!"
    status: backlog
    priority: 2

  - slug: alhamdulillah-khatam
